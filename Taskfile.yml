version: '3'

# The startup-* tasks run GetGit in Docker (see the "Run with Docker" section
# of the README). One-time setup: `cp .env.example .env` (paste your PAT), then
# `docker compose build`. `docker compose run` builds the image automatically if
# it's missing; rebuild after code changes with `docker compose build`.
tasks:
  startup-tiny:
    desc: 'Scrape USERNAME in Docker with small caps for cheap test runs (100 commits, 100 PRs). Usage: task startup-tiny -- USERNAME'
    cmds:
      - docker compose run --rm getgit {{.CLI_ARGS}} --max-commits 100 --max-prs 100

  startup:
    desc: 'Full scrape of USERNAME in Docker — no caps. Usage: task startup -- USERNAME'
    cmds:
      - docker compose run --rm getgit {{.CLI_ARGS}}

  startup-repo:
    desc: 'Scrape USERNAME within a single repo in Docker, no caps (one repo is small enough). Usage: task startup-repo -- USERNAME --repo OWNER/NAME'
    cmds:
      - docker compose run --rm getgit {{.CLI_ARGS}}

  test:
    desc: Build the dev image (tests + dev deps) via compose and run the pytest suite inside it.
    # isTest flips the compose service to docker/dev.Dockerfile. GITHUB_TOKEN is
    # only set to satisfy the compose token guard — the suite never authenticates.
    env:
      isTest: '1'
      GITHUB_TOKEN: not-used-by-tests
    cmds:
      - docker compose run --build --rm getgit pytest
